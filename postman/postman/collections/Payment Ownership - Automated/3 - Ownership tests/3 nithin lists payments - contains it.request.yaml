$kind: http-request
name: 3 nithin lists payments -> contains it
url: "{{serviceBUrl}}/payments"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_nithin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('list contains the payment', () => pm.expect(pm.response.json().map(p => p.paymentId)).to.include(pm.collectionVariables.get('paymentId')));
    language: text/javascript
order: 3000
