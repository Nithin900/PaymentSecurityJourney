$kind: http-request
name: 1 nithin creates payment -> 200
url: "{{serviceBUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "paymentId": "{{paymentId}}",
      "accountNumber": "acc-123",
      "amount": 25.00
    }
auth:
  type: bearer
  credentials:
    token: "{{token_nithin}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('paymentId', 'OWN-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('SUCCESS', () => pm.expect(pm.response.json().status).to.eql('SUCCESS'));
    language: text/javascript
order: 1000
