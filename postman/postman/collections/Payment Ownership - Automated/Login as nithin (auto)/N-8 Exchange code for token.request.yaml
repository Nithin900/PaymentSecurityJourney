$kind: http-request
url: "{{authServerUrl}}/oauth2/token"
method: POST
body:
  type: urlencoded
  content:
    grant_type: authorization_code
    code: "{{authCode}}"
    redirect_uri: "{{redirectUri}}"
auth:
  type: basic
  credentials:
    username: "{{clientId}}"
    password: "{{clientSecret}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('token endpoint 200', () => pm.response.to.have.status(200));
      const t = pm.response.json().access_token;
      pm.collectionVariables.set('token_nithin', t);
      const p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      pm.test('token sub is nithin', () => pm.expect(p.sub).to.eql('nithin'));
    language: text/javascript
order: 8000
