$kind: http-request
url: "{{authServerUrl}}/login"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const m = pm.response.text().match(/name="_csrf"[^>]*?value="([^"]+)"/);
      pm.collectionVariables.set('csrf', m ? m[1] : '');
      pm.test('csrf found', () => pm.expect(pm.collectionVariables.get('csrf')).to.not.be.empty);
    language: text/javascript
settings:
  followRedirects: false
order: 4000
