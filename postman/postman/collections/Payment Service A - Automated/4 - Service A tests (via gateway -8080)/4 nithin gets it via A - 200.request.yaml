$kind: http-request
name: 4 nithin gets it via A -> 200
url: "{{serviceAUrl}}/payments/{{paymentId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_nithin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('same id', () => pm.expect(pm.response.json().paymentId).to.eql(pm.collectionVariables.get('paymentId')));
    language: text/javascript
order: 4000
