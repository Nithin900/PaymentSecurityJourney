spring.application.name=payment-service-b

server.port=8081

# MySQL Database (DB_USER defaults to root; DB_PASSWORD comes from the environment)
spring.datasource.url=jdbc:mysql://localhost:3306/paymentdb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
# pool name shows in logs; a connection held longer than 20 s is logged with a stack trace (leak detection)
spring.datasource.hikari.pool-name=payments-pool
spring.datasource.hikari.leak-detection-threshold=20000
# log any SQL statement slower than 100 ms (logger org.hibernate.SQL_SLOW)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=100

# JPA
spring.jpa.hibernate.ddl-auto=update
# show-sql prints straight to stdout (no trace id); log SQL through the logger instead
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=debug
# one line per statement so every SQL line carries the trace id
spring.jpa.properties.hibernate.format_sql=false


# H2 console is off by default; enabled only by the dev profile (application-dev.properties)
# run locally with: --spring.profiles.active=dev
spring.h2.console.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# Redis cache (Memurai on Windows): payment reads are cached for 10 minutes
# short timeouts so a Redis outage costs ~0.5 s per request, not 2 s
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# Service-to-service: B gets its own client_credentials token to call the notification service
spring.security.oauth2.client.provider.auth-server.token-uri=http://localhost:9000/oauth2/token
spring.security.oauth2.client.registration.notification.provider=auth-server
spring.security.oauth2.client.registration.notification.client-id=payment-service-b
spring.security.oauth2.client.registration.notification.client-secret=${SERVICE_B_CLIENT_SECRET}
spring.security.oauth2.client.registration.notification.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.notification.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.notification.scope=notification.send

notification.base-url=http://localhost:8082

# Tracing: one trace id on every log line of a payment, carried A -> B -> Notification
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[%X{traceId:-}]\u0020
# keeps the trace across WebClient .block()
spring.reactor.context-propagation=auto

# Option 1: GET /actuator/mappings lists every URL and the controller method that handles it (needs any valid token)
management.endpoints.web.exposure.include=health,mappings,metrics
# health details (database up or down) only for callers with a valid token; anonymous sees UP or DOWN
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
