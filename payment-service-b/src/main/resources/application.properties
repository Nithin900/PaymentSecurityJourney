spring.application.name=payment-service-b

server.port=8081

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/paymentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# H2 console is off by default; enabled only by the dev profile (application-dev.properties)
# run locally with: --spring.profiles.active=dev
spring.h2.console.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000