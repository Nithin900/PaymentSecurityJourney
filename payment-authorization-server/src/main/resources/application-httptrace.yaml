# HTTP trace profile: add it with  $env:SPRING_PROFILES_ACTIVE="dev,local,httptrace"  before start-all.ps1
# Tomcat prints every raw HTTP request it receives (request line + headers); Spring prints the outgoing calls and the status it answers with.
logging:
  level:
    org.apache.coyote.http11.Http11InputBuffer: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
