spring:
  application:
    name: payment-authorization-server
  datasource:
    url: jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: auth-pool            # shows in logs
      leak-detection-threshold: 20000 # a connection held longer than 20 s is logged with a stack trace
  jpa:
    hibernate:
      ddl-auto: update                # creates/updates the users table from UserEntity
    show-sql: false
    properties:
      hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 100   # slow SQL goes to logger org.hibernate.SQL_SLOW
clients:                          # OAuth client secrets: environment variables only, never in git
  payment:
    secret: ${PAYMENT_CLIENT_SECRET}
  service-b:
    secret: ${SERVICE_B_CLIENT_SECRET}

admin:                            # first admin for POST /register; seeded only when ADMIN_PASSWORD is set
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:}
  email: ${ADMIN_EMAIL:admin@localhost}

server:
  port: 9000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics       # both need a login on this server (admin Basic auth works)
  endpoint:
    health:
      show-details: when-authorized   # database up or down only for logged-in callers
      show-components: when-authorized
  tracing:
    sampling:
      probability: 1.0        # default is 0.1: only 1 payment in 10 would carry a trace

logging:
  pattern:
    correlation: "[%X{traceId:-}] "   # trace id right after the log level
  level:
    org.springframework.security: trace   # shows every security decision in the console, great for learning
