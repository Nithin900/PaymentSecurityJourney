<style>
:root{color-scheme:dark;--bg:#000;--ink:#fff;--muted:#a3a3a3;--faint:#6b6b6b;--line:#2a2a2a;--panel:#0c0e11;--active:#f0a35c;--add:#5fd38d;--chg:#f2c14e;--del:#e5534b;--link:#5cc8f0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
a{color:var(--link)}
button,select{font:500 14px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#15181d;border:1px solid #3a414b;border-radius:6px;padding:6px 10px;min-height:34px}
button{cursor:pointer}
button:hover,select:hover{border-color:#8fa3b8}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px}
.brand{font-weight:700;margin-right:6px;white-space:nowrap}
.nav{display:flex;gap:12px;font-size:13px;margin-left:auto;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--ink)}
#topic{flex:0 1 210px}
#scenario{flex:1 1 260px;min-width:0}
.counter{color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px;text-align:center;font-size:13px}
.chips{display:flex;gap:4px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:thin}
.chips button{min-height:26px;min-width:28px;padding:2px 6px;font-size:12px;border-radius:13px;flex:0 0 auto}
.chips button.seen{border-color:#7c6a55;color:#e3c9a8}
.chips button.cur{background:var(--active);border-color:var(--active);color:#000}

/* main layout */
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:12px 16px 40px;align-items:start}
.left{display:grid;gap:10px;min-width:0}
.goal{margin:0;color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
.tools button{font-size:12.5px;min-height:28px;padding:3px 10px}
.key span{white-space:nowrap}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--own);margin-right:5px;vertical-align:0}
.diagram{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:#050608}
.diagram svg{display:block;height:auto}
details.yours{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
details.yours summary{cursor:pointer;font-weight:600}
details.yours ol{margin:8px 0 0;padding-left:20px;display:grid;gap:5px}
details.yours li b{color:var(--own)}

.right{position:sticky;top:var(--topH,100px);max-height:calc(100vh - var(--topH,100px) - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);min-height:38px}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--active)}
.pane{padding:14px;display:grid;gap:9px;align-content:start}
.pane[hidden]{display:none}
.pane h2{margin:0;font-size:18px;line-height:1.3}
.boxname{font-size:13px;color:var(--muted)}
.where{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--link);word-break:break-word}
.pane h3{margin:6px 0 0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pane ul{margin:0;padding-left:18px;display:grid;gap:4px}
.pane p{margin:0}
.fail{color:#f3b0ab}
.iv{border-left:3px solid var(--link);padding-left:10px}
.note{font-size:13px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{font-size:12.5px;padding:4px 9px;min-height:30px}
.tag{display:inline-block;font:700 11px system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid var(--own);color:var(--own);width:max-content}
.state{font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.state .sec{color:var(--muted);font-weight:700;margin-top:8px;letter-spacing:.05em}
.state .sec:first-child{margin-top:0}
.state .row{display:grid;grid-template-columns:12px minmax(90px,150px) 1fr;gap:6px;padding:1px 4px;border-radius:4px}
.state .k{color:#9fb3c8;word-break:break-word}
.state .v{word-break:break-word}
.state .row.add{background:rgba(95,211,141,.12)}.state .row.add .m{color:var(--add)}
.state .row.chg{background:rgba(242,193,78,.12)}.state .row.chg .m{color:var(--chg)}
.state .row.del{background:rgba(229,83,75,.12);text-decoration:line-through;color:var(--faint)}.state .row.del .m{color:var(--del)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px}
.empty{color:var(--faint);font-size:13px}
.pane details{border-top:1px solid var(--line);padding-top:6px}
.pane details summary{cursor:pointer;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pane details[open] summary{margin-bottom:6px}
.pane .back{justify-self:start;font-size:13px;min-height:30px;border-color:var(--active);color:var(--active);background:transparent}
.pane .stage{justify-self:stretch;text-align:left;font-size:14px;font-weight:600;border-color:var(--active);background:#2a1d0f;color:#ffd9b0;padding:10px 12px}
.pane .stage .note{font-weight:400}
.pane .end{border-top:1px solid var(--line);padding-top:8px}
.pane .zoom{border-color:#2f5b6b;color:#bfe9f7}
.gq h2{margin:0}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:10px 12px;min-height:44px;display:grid;gap:2px}
.opts button .oc{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
.gskip{justify-self:start;background:transparent;color:var(--muted);font-size:13px;min-height:30px}
.verdict{border-radius:8px;padding:8px 10px;font-weight:600;font-size:14px}
.verdict.ok{background:rgba(95,211,141,.15);color:var(--add);border:1px solid rgba(95,211,141,.4)}
.verdict.no{background:rgba(229,83,75,.12);color:#f3b0ab;border:1px solid rgba(229,83,75,.4)}
.score{font-size:12px;color:var(--muted)}
.changed-count{font-size:11px;background:var(--chg);color:#000;border-radius:8px;padding:0 6px;margin-left:6px}

/* svg */
.grp rect{fill:#0a0c0f;stroke:#23272e}
.grp text{fill:var(--faint);font-size:10.5px;letter-spacing:.04em}
.node{cursor:pointer}
.node rect.box{fill:#15181d;stroke:#3a414b;stroke-width:1.1}
.node text{fill:#e8e8e8;pointer-events:none}
.node .bar{fill:var(--own)}
.node.dim{opacity:.33}
.node.unseen{visibility:hidden;pointer-events:none}
#hideun[hidden]{display:none}
.node:hover rect.box{stroke:#8fa3b8}
.node.visited rect.box{stroke:#7c6a55;fill:#17140f}
.node.active rect.box{stroke:var(--active);stroke-width:2.2;fill:#2a1d0f}
.node.info rect.box{stroke:var(--link);stroke-width:2}
.node:focus{outline:none}
.node:focus-visible rect.box{stroke:var(--link);stroke-width:2.4}
.badge circle{fill:var(--active)}
.badge text{fill:#000;font-size:10px;font-weight:700;text-anchor:middle}
#hop{stroke:var(--active);stroke-width:2.2;fill:none}
.mine .node.own-spring,.mine .node.own-ext{opacity:.18}
.own-spring{--own:#6b6b6b}.own-config{--own:#5cc8f0}.own-write{--own:#5fd38d}.own-ext{--own:#b58cf0}

/* step card sits next to the active box */
.stagewrap{position:relative}
.card{position:absolute;z-index:3;width:var(--cardW,380px);background:var(--panel);border:1px solid var(--active);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.card.inline{position:static;width:auto;margin-top:10px}
.leader{position:absolute;height:0;border-top:2px dashed var(--active);z-index:2;pointer-events:none}
.leader.hide{display:none}
.cnav{display:flex;gap:8px;align-items:center;padding:2px 0 4px}
.cnav button{flex:1;min-height:40px;font-weight:600}
.cnav #cnext{background:var(--active);border-color:var(--active);color:#000}
.cnav #cnext:disabled{background:#15181d;border-color:#3a414b;color:var(--muted)}
.cnav .counter{flex:0 0 auto}
@media (max-width:900px){ .nav{margin-left:0;width:100%} }
@media (max-width:700px){ .bar{padding:8px 12px}.chips{padding:0 12px 8px}.main{padding:10px 12px 40px}.top{position:static} }
.wrap>*,.main>*,.left>*{min-width:0}
</style>

 {n:"f_ctx",t:"Load the security context",w:"SecurityContextHolderFilter.doFilter → securityContextRepository.loadDeferredContext",
  d:["Deferred (lazy) load from HttpSessionSecurityContextRepository.","Anonymous session → empty context.","finally: SecurityContextHolder.clearContext()."],
  c:{"SECURITY CONTEXT (thread)|authentication":"null (empty, deferred)"},
  f:"Nothing fails; empty just means not logged in.",
  iv:"Since 6.0 this filter only LOADS the context; saving is explicit, done by the authentication filter."},
 {n:"f_hdr",t:"Register security headers",w:"HeaderWriterFilter.doFilterInternal",
  d:["Headers are written when the response is committed.","Defaults: Cache-Control no-store, X-Content-Type-Options nosniff, X-Frame-Options DENY, HSTS on HTTPS."],
  c:{"RESPONSE|pending headers":"Cache-Control, X-Content-Type-Options, X-Frame-Options"},
  f:"No failure path.",iv:"Security headers come from HeaderWriterFilter; tune with http.headers(...)."},
 {n:"f_csrf",t:"Check the CSRF token",w:"CsrfFilter.doFilterInternal → requireCsrfProtectionMatcher.matches → equalsConstantTime",
  d:["POST is state-changing, so it's checked.","Submitted _csrf equals the session token → continue."],
  c:{"REQUEST|csrf check":"passed"},
  f:"Missing/wrong token → 403 (see the CSRF attack scenario).",
  iv:"CSRF token = a per-session secret an attacker's site can't read."},
 {n:"f_logout",t:"Not a logout request",w:"LogoutFilter.requiresLogout → false",
  d:["Only POST /logout matches; this passes through."],c:{},
  f:"—",iv:"Every filter first asks 'is this request mine?' and otherwise just calls chain.doFilter."},
 {n:"f_upaf",t:"Read the credentials",w:"UsernamePasswordAuthenticationFilter.attemptAuthentication",
  d:["requiresAuthentication: POST /login → yes.","Builds UsernamePasswordAuthenticationToken.unauthenticated(\"nithin\",\"password\").","getAuthenticationManager().authenticate(token)."],
  c:{"AUTHENTICATION OBJECT|type":"UsernamePasswordAuthenticationToken","AUTHENTICATION OBJECT|principal":"\"nithin\" (String)","AUTHENTICATION OBJECT|credentials":"\"password\"","AUTHENTICATION OBJECT|authenticated":"false"},
  f:"Not POST /login → passes the request on.",
  iv:"An authentication filter converts the request into an UNVERIFIED Authentication and delegates."},
 {n:"mgr",t:"Find a provider",w:"ProviderManager.authenticate → provider.supports(UsernamePasswordAuthenticationToken.class)",
  d:["Loops AuthenticationProviders; first supports()==true does the work.","The manager itself checks nothing."],
  c:{"AUTHENTICATION OBJECT|handled by":"ProviderManager"},
  f:"No provider supports it → ProviderNotFoundException.",iv:"ProviderManager is a dispatcher over AuthenticationProviders."},
 {n:"p_dao",t:"DaoAuthenticationProvider takes it",w:"AbstractUserDetailsAuthenticationProvider.authenticate → retrieveUser",
  d:["Supports username/password tokens.","Asks the UserDetailsService for the user."],
  c:{"AUTHENTICATION OBJECT|handled by":"DaoAuthenticationProvider"},
  f:"—",iv:"Dao provider = load user (UserDetailsService) + check password (PasswordEncoder)."},
 {n:"uds",t:"Load the user",w:"JdbcUserDetailsManager.loadUserByUsername(\"nithin\")",
  d:["Runs the users query then the authorities query.","Returns a UserDetails."],
  c:{"LOADED USER|username":"nithin","LOADED USER|password":"{bcrypt}$2a$10$Ez…","LOADED USER|authorities":"[ROLE_USER]","LOADED USER|enabled/locked":"true / false"},
  f:"No user → UsernameNotFoundException, hidden as BadCredentialsException.",
  iv:"UserDetailsService only loads by name; it never checks the password."},
 {n:"db",t:"Database query",w:"select username,password,enabled from users where username=?",
  d:["Then: select username,authority from authorities where username=?"],
  c:{"LOADED USER|source":"users + authorities tables"},
  f:"No row → user not found.",iv:"Only the hash with an {id} prefix is stored, never the plain password."},
 {n:"enc",t:"Compare the password",w:"DaoAuthenticationProvider.additionalAuthenticationChecks → DelegatingPasswordEncoder.matches",
  d:["preAuthenticationChecks: not locked, enabled, not expired.","{bcrypt} prefix → BCryptPasswordEncoder re-hashes with the stored salt → match."],
  c:{"AUTHENTICATION OBJECT|password check":"matches = true"},
  f:"No match → BadCredentialsException (next scenario).",iv:"Passwords are matched, never decrypted."},
 {n:"p_dao",t:"Build the authenticated token",w:"createSuccessAuthentication → ProviderManager.eraseCredentials",
  d:["New token: principal = UserDetails, authorities filled, authenticated = true.","ProviderManager erases the password and publishes AuthenticationSuccessEvent."],
  c:{"AUTHENTICATION OBJECT|principal":"User(nithin)","AUTHENTICATION OBJECT|credentials":"null (erased)","AUTHENTICATION OBJECT|authenticated":"true","AUTHENTICATION OBJECT|authorities":"[ROLE_USER]","AUTHENTICATION OBJECT|password check":null,"AUTHENTICATION OBJECT|handled by":null},
  f:"—",iv:"A provider returns a NEW Authentication object on success."},
 {n:"f_upaf",t:"Protect the session",w:"sessionStrategy.onAuthentication (ChangeSessionIdAuthenticationStrategy, CsrfAuthenticationStrategy)",
  d:["request.changeSessionId() → stops session fixation.","New CSRF token issued."],
  c:{"SESSION|id":"C3D4 (was A1B2)","SESSION|CSRF token":"p7Lm… (new)"},
  f:"—",iv:"Session fixation protection: the session id changes on login."},
 {n:"holder",t:"Put the user on the thread",w:"successfulAuthentication → SecurityContextHolder.setContext(context)",
  d:["createEmptyContext, setAuthentication(result).","Later code on this thread reads it."],
  c:{"SECURITY CONTEXT (thread)|authentication":"UsernamePasswordAuthenticationToken(nithin, [ROLE_USER])"},
  f:"—",iv:"SecurityContextHolder is ThreadLocal; @Async threads don't inherit it by default."},
 {n:"session",t:"Save the context in the session",w:"HttpSessionSecurityContextRepository.saveContext",
  d:["Stores it under SPRING_SECURITY_CONTEXT so the next request is logged in."],
  c:{"SESSION|SPRING_SECURITY_CONTEXT":"SecurityContext(nithin)"},
  f:"—",iv:"Login survives between requests because the context is saved in the HttpSession."},
 {n:"response",t:"Redirect to the saved page",w:"SavedRequestAwareAuthenticationSuccessHandler.onAuthenticationSuccess",
  d:["Redirects to the request saved before login (Auth Server: /oauth2/authorize?…), else '/'.","No controller runs for POST /login.","Thread context cleared in the finally block."],
  c:{"RESPONSE|status":"302 Found","RESPONSE|Location":"saved request or /","RESPONSE|Set-Cookie":"JSESSIONID=C3D4; HttpOnly","RESPONSE|pending headers":null,"RESPONSE|headers":"Cache-Control no-store, X-Frame-Options DENY, nosniff","SECURITY CONTEXT (thread)|authentication":"cleared (still in session)"},
  f:"—",iv:"Next request sends JSESSIONID=C3D4 and SecurityContextHolderFilter loads the user from the session."}
 ]},

{id:"anon", group:"Browser + session", name:"Not logged in → redirect to login",
 goal:"Anonymous user opens a protected page → AuthorizationFilter denies → ExceptionTranslationFilter saves the request and starts login.",
 steps:[
 {n:"client",t:"Open a protected page",w:"GET /payments/history",d:["No session cookie yet."],
  c:{"REQUEST|line":"GET /payments/history","REQUEST|Cookie":"(none)"},f:"—",iv:"—"},
 {n:"f_ctx",t:"Empty context",w:"SecurityContextHolderFilter → loadDeferredContext",d:["No session → empty context."],
  c:{"SECURITY CONTEXT (thread)|authentication":"null"},f:"—",iv:"—"},
 {n:"f_reqcache",t:"No saved request to replay",w:"RequestCacheAwareFilter → requestCache.getMatchingRequest → null",d:["Nothing saved yet; passes on."],c:{},f:"—",iv:"This filter matters AFTER login, when the original request is replayed."},
 {n:"f_anon",t:"Become 'anonymousUser'",w:"AnonymousAuthenticationFilter.doFilter → createAuthentication",
  d:["Context is empty, so it sets AnonymousAuthenticationToken.","Later code never sees null."],
  c:{"SECURITY CONTEXT (thread)|authentication":"AnonymousAuthenticationToken(anonymousUser, [ROLE_ANONYMOUS])"},
  f:"—",iv:"Anonymous is still an Authentication; isAuthenticated() is true, so check with AuthenticationTrustResolver.isAnonymous()."},
 {n:"f_etf",t:"Wrap the rest in try/catch",w:"ExceptionTranslationFilter.doFilter → chain.doFilter inside try",
  d:["It does nothing on the way in; it waits for exceptions from later filters."],c:{},f:"—",
  iv:"ExceptionTranslationFilter only translates exceptions thrown AFTER it in the chain."},
 {n:"f_authz",t:"Check the URL rule",w:"AuthorizationFilter.doFilter → authorizationManager.authorize",
  d:["Rule: anyRequest().authenticated()."],c:{"REQUEST|rule":"anyRequest().authenticated()"},f:"—",iv:"—"},
 {n:"azmgr",t:"Deny: anonymous",w:"RequestMatcherDelegatingAuthorizationManager → AuthenticatedAuthorizationManager.check → false",
  d:["Anonymous doesn't count as authenticated.","AuthorizationFilter throws AuthorizationDeniedException (an AccessDeniedException)."],
  c:{"REQUEST|decision":"DENIED → AuthorizationDeniedException"},f:"—",iv:"URL rules are evaluated by an AuthorizationManager in AuthorizationFilter."},
 {n:"f_etf",t:"Anonymous + denied = needs login",w:"handleAccessDeniedException → trustResolver.isAnonymous → sendStartAuthentication",
  d:["Anonymous user, so this is treated as 'please authenticate', not 403.","Clears the context."],
  c:{"SECURITY CONTEXT (thread)|authentication":"null (cleared)"},f:"—",
  iv:"Denied + anonymous → AuthenticationEntryPoint (401/login). Denied + logged in → AccessDeniedHandler (403)."},
 {n:"reqstore",t:"Remember where the user wanted to go",w:"HttpSessionRequestCache.saveRequest",
  d:["Creates a session and stores the request so login can send the user back."],
  c:{"SESSION|id":"A1B2 (new)","SESSION|SPRING_SECURITY_SAVED_REQUEST":"GET /payments/history"},f:"—",
  iv:"That's how, after login, you land on the page you first asked for."},
 {n:"entry",t:"Start authentication",w:"LoginUrlAuthenticationEntryPoint.commence",
  d:["formLogin() registers this entry point."],c:{},f:"—",iv:"The entry point decides HOW to ask for credentials: login page, Basic challenge or Bearer challenge."},
 {n:"response",t:"Redirect to /login",w:"redirectStrategy.sendRedirect(\"/login\")",d:["Browser loads the login page (then see Form login)."],
  c:{"RESPONSE|status":"302 Found","RESPONSE|Location":"/login","RESPONSE|Set-Cookie":"JSESSIONID=A1B2"},f:"—",
  iv:"Same situation on an API with Bearer tokens gives 401 instead, because the entry point is different."}
 ]},

{id:"method-deny", group:"Browser + session", name:"Logged in, but @PreAuthorize says no (403)",

 {n:"f_ctx",t:"Load context from the session",w:"SecurityContextHolderFilter → repo.loadDeferredContext",d:["Deferred: loaded the first time someone asks."],c:{},f:"—",iv:"—"},
 {n:"repo",t:"Repository reads the session",w:"HttpSessionSecurityContextRepository.readSecurityContextFromSession",d:["Looks up SPRING_SECURITY_CONTEXT."],c:{},f:"—",iv:"—"},

  c:{"SESSION|SPRING_SECURITY_CONTEXT":"SecurityContext(nithin)","SECURITY CONTEXT (thread)|authentication":"UsernamePasswordAuthenticationToken(nithin, [ROLE_USER])"},
  f:"Session expired → empty context → anonymous → redirect to login.",iv:"Session login = context stored server-side, found by JSESSIONID."},
 {n:"f_anon",t:"Skipped",w:"AnonymousAuthenticationFilter: context already has an Authentication",d:["Does nothing."],c:{},f:"—",iv:"—"},

{id:"jwt-ok", next:["journey","post-ok",7,"Spring MVC → controller → @Transactional → DB → JSON"], extra:["f_csrf","repo"], group:"API + tokens", name:"JWT accepted on Service B (201)",
 goal:"Bearer JWT → decode + verify signature with JWKS → SCOPE_ authorities → rule passes → handed to Spring MVC. Next on the last step continues into the full journey.",
 steps:[
 {n:"client",t:"API call with a Bearer token",w:"POST /payments (Service B :8081)",d:["Token was issued by the Auth Server :9000."],
  c:{"REQUEST|line":"POST /payments","REQUEST|Authorization":"Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6Ijk…","REQUEST|Cookie":"(none, stateless)"},f:"—",iv:"—"},
 {n:"fcp",t:"Resource-server chain",w:"FilterChainProxy",d:["csrf disabled, sessionCreationPolicy STATELESS, oauth2ResourceServer().jwt()."],
  c:{"REQUEST|chain":"Service B SecurityFilterChain"},f:"—",iv:"CSRF is off because the browser doesn't attach Bearer tokens automatically."},
 {n:"f_bearer",t:"Extract the token",w:"BearerTokenAuthenticationFilter.doFilterInternal → DefaultBearerTokenResolver.resolve",
  d:["Reads 'Authorization: Bearer …'.","Builds BearerTokenAuthenticationToken → AuthenticationManager."],
  c:{"AUTHENTICATION OBJECT|type":"BearerTokenAuthenticationToken","AUTHENTICATION OBJECT|token":"eyJhbGci…","AUTHENTICATION OBJECT|authenticated":"false"},
  f:"No header → filter passes; later anonymous → 401 with plain 'WWW-Authenticate: Bearer'.",iv:"—"},
 {n:"mgr",t:"Pick the JWT provider",w:"ProviderManager.authenticate",d:["JwtAuthenticationProvider supports BearerTokenAuthenticationToken."],c:{},f:"—",iv:"—"},
 {n:"p_jwt",t:"Decode",w:"JwtAuthenticationProvider.authenticate → jwtDecoder.decode(token)",d:["Delegates signature and claim checks to the JwtDecoder."],c:{},f:"—",iv:"—"},
 {n:"decoder",t:"Parse and find the key",w:"NimbusJwtDecoder.decode → JWTParser.parse → header kid",
  d:["Header: alg RS256, kid 9f…","Needs the public key with that kid."],
  c:{"JWT|header":"alg=RS256, kid=9f…","JWT|claims":"iss=http://localhost:9000, sub=nithin, scope=[payment.read, payment.write], exp=+5min"},f:"—",iv:"—"},
 {n:"jwks",t:"Public key from JWKS",w:"RemoteJWKSet (cached) ← GET http://localhost:9000/oauth2/jwks",
  d:["Fetched once via issuer-uri discovery and cached.","Unknown kid → refetch (key rotation)."],

  d:["Signature verified with the public key.","exp/nbf checked with 60 s clock skew; iss must equal issuer-uri."],

 {n:"p_jwt",t:"Claims → authorities",w:"JwtAuthenticationConverter → JwtGrantedAuthoritiesConverter.convert",
  d:["Reads scope/scp claim, prefixes SCOPE_.","Principal name = sub."],

  f:"—",iv:"Scopes become SCOPE_x authorities; customize the converter for roles claims."},
 {n:"holder",t:"Context set, not in a session",w:"BearerTokenAuthenticationFilter → SecurityContextHolder.setContext + RequestAttributeSecurityContextRepository",
  d:["Stateless: nothing stored between requests."],
  c:{"SECURITY CONTEXT (thread)|authentication":"JwtAuthenticationToken(nithin, SCOPE_payment.write…)"},f:"—",iv:"—"},
 {n:"f_authz",t:"URL rule",w:"AuthorizationFilter → hasAuthority(\"SCOPE_payment.write\")",d:["POST /payments needs payment.write."],c:{},f:"—",iv:"—"},
 {n:"azmgr",t:"Granted",w:"AuthorityAuthorizationManager.check → true",d:["Authority present."],c:{"REQUEST|decision":"GRANTED"},f:"Missing scope → 403 (see scenario).",iv:"—"},
 {n:"ds",t:"Security is done → Spring MVC takes over",w:"AuthorizationFilter → chain.doFilter → (end of FilterChainProxy) → DispatcherServlet.service",
  d:["All security filters passed; the last chain.doFilter call leaves the security chain and reaches the DispatcherServlet.","The SecurityContext stays on this thread, so the controller can use @AuthenticationPrincipal Jwt jwt → jwt.getSubject().","Spring Security's job for this request is finished until the response comes back (then SecurityContextHolderFilter clears the context)."],
  c:{"REQUEST|now in":"DispatcherServlet (Spring MVC)"},f:"—",
  iv:"Spring Security is a servlet filter in front of Spring MVC; once it calls chain.doFilter the request continues into the DispatcherServlet with the user on the thread."}
 ]},

  f:"Invalid YAML → startup fails here with the file name and line.",iv:"Config files are loaded by an EnvironmentPostProcessor before any bean exists."},
 {n:"ctx",t:"Banner, then create the context",w:"printBanner → createApplicationContext (ApplicationContextFactory.DEFAULT)",

{id:"props", group:"Configuration", name:"Where does a property value come from? (order + profiles)",
 goal:"The same key in several places — which one wins, and how env vars map to property names.",
 steps:[

  c:{"ENVIRONMENT|spring.datasource.url":"jdbc:h2:mem:payments (application.yml)","ENVIRONMENT|payment.max-amount":"5000 (application.yml)"},f:"—",iv:"—"},
 {n:"profiles",t:"Activate the prod profile",w:"SPRING_PROFILES_ACTIVE=prod (env var)",d:["application-prod.yml is loaded after application.yml, so its values win."],
  c:{"ENVIRONMENT|active profiles":"[prod]"},f:"Typo in the profile name → no error, just defaults. Check the log line 'The following 1 profile is active: \"prod\"'.",iv:"—"},
 {n:"cfgdata",t:"Profile file overrides",w:"ConfigDataEnvironment → application-prod.yml",d:["spring.datasource.url: jdbc:postgresql://db:5432/payments"],
  c:{"ENVIRONMENT|spring.datasource.url":"jdbc:postgresql://db:5432/payments (application-prod.yml)"},f:"—",iv:"Profile-specific files override the default file; files outside the jar override files inside."},
 {n:"propsrc",t:"Environment variable beats both",w:"SystemEnvironmentPropertySource: SPRING_DATASOURCE_PASSWORD → spring.datasource.password",

  c:{"ENVIRONMENT|spring.datasource.password":"****** (OS env var)"},f:"—",iv:"Order (high → low): command line > system properties > env vars > profile yml > application.yml > defaults."},

{id:"cfgprops", group:"Configuration", name:"@ConfigurationProperties binding and validation failure",
 goal:"Type-safe settings: bind a prefix to a record, validate it, and what the startup failure looks like.",
 steps:[
 {n:"props",t:"Your properties record",w:"@ConfigurationProperties(\"payment\") @Validated record PaymentProperties(@Positive BigDecimal maxAmount, @NotBlank String currency)",
  d:["Registered with @ConfigurationPropertiesScan on the main class (or @EnableConfigurationProperties)."],c:{"BEAN DEFINITIONS|paymentProperties":"PaymentProperties (constructor binding)"},f:"Not registered → NoSuchBeanDefinitionException where it's injected.",iv:"—"},
 {n:"binder",t:"Bind at creation",w:"ConfigurationPropertiesBeanRegistrar (definition + instance supplier) → ConstructorBound.from → ConfigurationPropertiesBinder.bindOrCreate → Binder.bindOrCreate",
  d:["A record is created with its constructor args from payment.*.","Relaxed names: payment.max-amount, PAYMENT_MAXAMOUNT both work.","Type conversion: \"5000\" → BigDecimal, \"30s\" → Duration."],
  c:{"BEANS|paymentProperties":"maxAmount=5000, currency=null"},f:"—",iv:"@ConfigurationProperties gives typed, validated, relaxed-bound settings; prefer it over many @Value fields."},
 {n:"props",t:"@Value vs @ConfigurationProperties",w:"@Value(\"${payment.max-amount}\") vs PaymentProperties",
  d:["@Value: one key, SpEL allowed, only limited relaxed binding (use the kebab-case name), no validation.","@ConfigurationProperties: a group of keys, full relaxed binding, @Validated, IDE auto-completion via spring-boot-configuration-processor (spring-configuration-metadata.json)."],c:{},f:"—",iv:"Use @Value for a single simple value; @ConfigurationProperties for anything structured or shared."},
 {n:"binder",t:"Validation fails",w:"ValidationBindHandler → BindValidationException",d:["currency is missing → @NotBlank violated."],c:{"BEANS|paymentProperties":"not created (invalid)"},f:"This is the failure path.",iv:"—"},
 {n:"failure",t:"Readable startup error",w:"FailureAnalyzers → BindValidationFailureAnalyzer",
  d:["APPLICATION FAILED TO START","Binding to target … failed: Property: payment.currency, Value: null, Reason: must not be blank","Action: Update your application's configuration."],
  c:{"CONSOLE|log":"APPLICATION FAILED TO START — payment.currency must not be blank"},f:"—",iv:"Invalid configuration fails at startup, not at the first request — fail fast."}
 ]},

{id:"autoconf", group:"Auto-configuration", name:"How a DataSource appears without you writing one",
 goal:"Starter on the classpath → candidate list → pre-filter → conditions → HikariDataSource built from properties.",
 steps:[
 {n:"starter",t:"You add a starter",w:"pom.xml: spring-boot-starter-data-jpa + com.h2database:h2",
  d:["The starter only pulls jars: spring-data-jpa, hibernate-core, HikariCP, spring-jdbc…","No code of yours mentions a DataSource."],c:{"CLASSPATH|jars":"HikariCP, hibernate-core, spring-data-jpa, h2"},f:"—",iv:"A starter is just a dependency bundle; the classpath is what triggers auto-configuration."},
 {n:"sba",t:"@EnableAutoConfiguration",w:"@SpringBootApplication → @EnableAutoConfiguration → @Import(AutoConfigurationImportSelector)",d:[],c:{},f:"—",iv:"—"},
 {n:"selector",t:"Deferred until your config is read",w:"ConfigurationClassParser → DeferredImportSelectorHandler → AutoConfigurationImportSelector.getAutoConfigurationEntry",
  d:["Your @Configuration classes and @Beans are registered first."],c:{"BEAN DEFINITIONS|yours":"registered"},f:"—",iv:"—"},
 {n:"imports",t:"Read the candidate list",w:"ImportCandidates.load(AutoConfiguration.class) → META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports",
  d:["~150 class names from spring-boot-autoconfigure (and any library's own file).","Minus exclusions (exclude = …, spring.autoconfigure.exclude)."],c:{"BEAN DEFINITIONS|candidates":"~150 auto-configurations"},f:"—",iv:"—"},
 {n:"filter",t:"Cheap pre-filter",w:"getConfigurationClassFilter().filter → OnClassCondition (metadata only)",
  d:["Classes not on the classpath (Mongo, Kafka, Redis…) are dropped without loading anything."],c:{"BEAN DEFINITIONS|candidates":"~60 left"},f:"—",iv:"—"},
 {n:"cond",t:"Full conditions on DataSourceAutoConfiguration",w:"@ConditionalOnClass(DataSource, EmbeddedDatabaseType) → PooledDataSourceConfiguration → DataSourceConfiguration.Hikari",
  d:["@ConditionalOnMissingBean(DataSource.class): you defined none → match.","@ConditionalOnClass(HikariDataSource) → Hikari chosen (first of Hikari, Tomcat, DBCP2…)."],c:{"BEAN DEFINITIONS|dataSource":"HikariDataSource (from DataSourceConfiguration.Hikari)"},
  f:"—",iv:"Auto-config = @Configuration classes guarded by conditions; @ConditionalOnMissingBean is what lets your bean win."},
 {n:"dsauto",t:"Bean built from properties",w:"DataSourceConfiguration.Hikari.dataSource(properties, JdbcConnectionDetails) → DataSourceBuilder → HikariDataSource",
  d:["No URL set and H2 on the classpath → embedded jdbc:h2:mem:<uuid>.","Since Boot 3.1 the URL/user/password come through a JdbcConnectionDetails bean (default: from properties). Testcontainers @ServiceConnection or Docker Compose support provide their own ConnectionDetails — that's how tests get a real Postgres without properties.","spring.datasource.hikari.* bound onto the pool."],c:{"BEANS|dataSource":"HikariDataSource (HikariPool-1)"},f:"No URL and no embedded DB → 'Failed to configure a DataSource: url attribute is not specified'.",iv:"—"},
 {n:"jpaauto",t:"Dependent auto-configs follow",w:"@AutoConfiguration(after = DataSourceAutoConfiguration.class) → HibernateJpaAutoConfiguration",
  d:["Ordering attributes make JPA config see the DataSource.","Creates EntityManagerFactory and JpaTransactionManager."],c:{"BEANS|entityManagerFactory":"LocalContainerEntityManagerFactoryBean","BEANS|transactionManager":"JpaTransactionManager"},f:"—",iv:"—"},
 {n:"report",t:"Check what happened",w:"--debug → CONDITIONS EVALUATION REPORT",
  d:["Positive matches: DataSourceAutoConfiguration matched: @ConditionalOnClass found required classes…","Negative matches: MongoAutoConfiguration: did not match: required class not found."],
  c:{"CONSOLE|log":"CONDITIONS EVALUATION REPORT (positive / negative matches)"},f:"—",iv:"'Why isn't my bean created?' → run with --debug and read the conditions report."}
 ]},

{id:"override", group:"Auto-configuration", name:"Your bean replaces Boot's default (back-off)",
 goal:"Defining your own ObjectMapper / PasswordEncoder / SecurityFilterChain makes the matching auto-config step aside.",
 steps:[
 {n:"yourbean",t:"You define a SecurityFilterChain",w:"@Bean SecurityFilterChain api(HttpSecurity http) in your SecurityConfig",d:["Registered in the first pass, before auto-config is evaluated."],c:{"BEAN DEFINITIONS|api":"SecurityFilterChain (yours)"},f:"—",iv:"—"},
 {n:"secauto",t:"Default chain backs off",w:"SpringBootWebSecurityConfiguration.defaultSecurityFilterChain → @ConditionalOnDefaultWebSecurity → no match",
  d:["The condition is 'no SecurityFilterChain bean exists'. Yours exists → Boot's default chain is not created.","Without yours, the default is: everything authenticated + form login + basic; or, when issuer-uri/jwk-set-uri is set, everything authenticated + oauth2ResourceServer(jwt)."],c:{"BEAN DEFINITIONS|defaultSecurityFilterChain":"SKIPPED (you have one)"},f:"—",iv:"—"},
 {n:"secauto",t:"Generated user also backs off",w:"UserDetailsServiceAutoConfiguration → @ConditionalOnMissingBean(…, type = JwtDecoder …)",
  d:["UserDetailsServiceAutoConfiguration also has @ConditionalOnMissingClass checks: just having the OAuth2 resource-server / client / SAML classes on the classpath (e.g. OpaqueTokenIntrospector) stops the generated user — unless spring.security.user.name/password are set.","So with oauth2-resource-server there's no in-memory 'user' and no generated password in the log."],c:{"CONSOLE|log":"(no 'Using generated security password')"},f:"Without any security config you'd see 'Using generated security password: …' and every endpoint needs login.",iv:"—"},
 {n:"rsauto",t:"Resource server gives you a JwtDecoder",w:"OAuth2ResourceServerAutoConfiguration → OAuth2ResourceServerJwtConfiguration → SupplierJwtDecoder",
  d:["Because issuer-uri is set and you defined no JwtDecoder bean.","It resolves the issuer's JWK Set on first use, so startup doesn't need the Auth Server running."],c:{"BEANS|jwtDecoder":"SupplierJwtDecoder (issuer http://localhost:9000)"},f:"—",iv:"—"},
 {n:"cond",t:"Order matters for @ConditionalOnMissingBean",w:"OnBeanCondition evaluated at REGISTER_BEAN phase",
  d:["Works reliably in auto-configurations because they're processed after your beans.","In your own normal @Configuration, @ConditionalOnMissingBean depends on processing order — avoid it there."],c:{},f:"—",iv:"@ConditionalOnMissingBean is meant for auto-configuration classes, not ordinary config."},
 {n:"jacksonauto",t:"Boot's ObjectMapper",w:"JacksonAutoConfiguration → Jackson2ObjectMapperBuilder → objectMapper (@ConditionalOnMissingBean)",
  d:["Registers modules (JavaTime, Jdk8, ParameterNames), applies spring.jackson.*, then every Jackson2ObjectMapperBuilderCustomizer bean."],c:{"BEANS|objectMapper":"Boot's (JavaTimeModule …)"},f:"—",iv:"—"},
 {n:"customizer",t:"Tweak instead of replace",w:"Jackson2ObjectMapperBuilderCustomizer / WebServerFactoryCustomizer beans",
  d:["Replacing ObjectMapper entirely loses Boot's settings (modules, spring.jackson.*).","A customizer adds to Boot's object instead."],c:{"BEANS|objectMapper":"Boot's, plus your customizer"},f:"@EnableWebMvc on a config class → Boot's WebMvcAutoConfiguration backs off completely (lost converters/static config).",
  iv:"Prefer properties, then customizers, then full replacement."}
 ]},

{id:"tomcat", group:"Startup", name:"Embedded Tomcat: create, register servlets/filters, start (port in use)",
 goal:"How the web server is part of the Spring context and when it actually starts listening.",
 steps:[
 {n:"webauto",t:"Factory bean",w:"ServletWebServerFactoryAutoConfiguration → EmbeddedTomcat → TomcatServletWebServerFactory",d:["server.port=8081 applied by a customizer (ServletWebServerFactoryCustomizer)."],c:{"BEANS|webServerFactory":"TomcatServletWebServerFactory(port=8081)"},f:"—",iv:"—"},
 {n:"wsf",t:"Tomcat created during refresh()",w:"ServletWebServerApplicationContext.onRefresh → createWebServer → factory.getWebServer(initializers)",
  d:["Happens before most singletons are created (onRefresh comes before finishBeanFactoryInitialization) — but Filter/registration beans, and whatever they inject, are created early here.","ServletContextInitializers run: DispatcherServletRegistrationBean, filter registrations (incl. springSecurityFilterChain via DelegatingFilterProxyRegistrationBean)."],
  c:{"WEB SERVER|state":"created, connectors not bound","WEB SERVER|servlets":"dispatcherServlet → /","WEB SERVER|filters":"characterEncoding, formContent, requestContext, springSecurityFilterChain"},f:"—",
  iv:"Boot registers the DispatcherServlet and filters into embedded Tomcat through ServletContextInitializer beans — no web.xml."},
 {n:"mvcauto",t:"DispatcherServlet bean",w:"DispatcherServletAutoConfiguration → dispatcherServlet + DispatcherServletRegistrationBean",d:["Initialised lazily on the first request by default (spring.mvc.servlet.load-on-startup=-1)."],c:{},f:"—",iv:"—"},
 {n:"wsstart",t:"Start listening",w:"finishRefresh → WebServerStartStopLifecycle.start → TomcatWebServer.start",
  d:["Connectors bound only after ALL beans are created, so no request can hit a half-built app."],c:{"WEB SERVER|state":"listening on 8081","CONSOLE|log":"Tomcat started on port 8081 (http) with context path '/'"},
  f:"Port busy → PortInUseException → 'Web server failed to start. Port 8081 was already in use.' + Action: identify and stop the process or change server.port.",iv:"Tomcat is created early in refresh() but only starts accepting connections at the end."},
 {n:"customizer",t:"Virtual threads (Boot 3.2+, Java 21)",w:"spring.threads.virtual.enabled=true",
  d:["Tomcat handles each request on a virtual thread; @Async and scheduling use virtual threads too.","The limit moves to the connection pool: thousands of requests can now wait on 10 Hikari connections.","Watch for pinning (synchronized blocks around blocking I/O on older JDKs)."],c:{"WEB SERVER|threads":"virtual (if enabled)"},f:"—",iv:"Virtual threads remove the thread-pool limit, not the database limit."},
 {n:"shutdown",t:"Graceful stop",w:"SpringApplicationShutdownHook → context.close → WebServerGracefulShutdownLifecycle",
  d:["First readiness → REFUSING_TRAFFIC (AvailabilityChangeEvent), then lifecycles stop: WebServerGracefulShutdownLifecycle stops new requests and lets in-flight ones finish (up to 30 s), then beans are destroyed, then Tomcat is destroyed."],c:{"WEB SERVER|state":"stopped"},f:"kill -9 skips all of this.",iv:"—"}
 ]},

{id:"actuator", group:"Actuator", name:"GET /actuator/health (and when it returns 503)",
 goal:"Health aggregation, exposure, security, and the database check.",
 steps:[
 {n:"actauto",t:"Actuator on the classpath",w:"spring-boot-starter-actuator → EndpointAutoConfiguration, HealthEndpointAutoConfiguration",d:["Endpoints are beans; only health is exposed over HTTP by default."],c:{"HTTP|exposed":"/actuator/health"},f:"—",iv:"—"},
 {n:"exposure",t:"Choose what's visible",w:"management.endpoints.web.exposure.include=health,info,metrics",d:["Each exposed endpoint gets a web mapping under /actuator."],c:{"HTTP|exposed":"/actuator/health, /actuator/info, /actuator/metrics"},f:"include=* in production exposes env, beans, heapdump.",iv:"—"},
 {n:"health",t:"Request passes security first",w:"Your SecurityFilterChain: requestMatchers(\"/actuator/health/**\").permitAll()",
  d:["Actuator endpoints are normal MVC endpoints behind your filter chain.","Load balancers/Kubernetes call health without a token, so it must be permitted."],c:{"HTTP|request":"GET /actuator/health (no token)"},f:"Not permitted → 401, and the load balancer marks the instance dead.",iv:"Permit /actuator/health in your SecurityFilterChain; secure the rest."},
 {n:"health",t:"Aggregate contributors",w:"HealthEndpointWebExtension → HealthEndpointSupport → CompositeHealthContributor",d:["Asks db, diskSpace, ping… then SimpleStatusAggregator picks the worst status."],c:{},f:"—",iv:"—"},
 {n:"dbhealth",t:"Database check",w:"DataSourceHealthIndicator.doHealthCheck → Connection.isValid / validation query",d:["Database down → DOWN."],c:{"HTTP|db":"DOWN (connection refused)"},f:"—",iv:"—"},

  d:["Body shows only {\"status\":\"DOWN\"} unless show-details is set."],c:{"HTTP|response":"503 {\"status\":\"DOWN\"}"},f:"—",iv:"Health returns 503 when DOWN so load balancers stop routing to the instance."},

{id:"tests", group:"Auto-configuration", name:"Tests: @SpringBootTest vs slices, @MockitoBean",
 goal:"How tests reuse auto-configuration: full context vs a slice, and why test startup is sometimes slow.",
 steps:[

{id:"startupspeed", group:"Startup", name:"Faster startup: lazy initialization, AOT and native image",
 goal:"Trade-offs when startup time matters (serverless, scale-to-zero).",

      if (lx2 > lx1 + 1){ lead.classList.remove("hide"); lead.style.left = lx1 + "px"; lead.style.width = (lx2 - lx1) + "px"; lead.style.top = cy + "px"; } else lead.classList.add("hide");
    } else lead.classList.add("hide");
    stage.style.minHeight = Math.max(dia.offsetHeight, top + H + 12) + "px";
  }

  function edgePoint(a, b){
    var cx = a.x + a.w/2, cy = a.y + a.h/2, dx = (b.x + b.w/2) - cx, dy = (b.y + b.h/2) - cy;
    if (!dx && !dy) return [cx, cy];
    var sx = dx ? (a.w/2) / Math.abs(dx) : Infinity, sy = dy ? (a.h/2) / Math.abs(dy) : Infinity, s = Math.min(sx, sy);
    return [cx + dx*s, cy + dy*s];
  }

  function drawState(){
    var st = steps[i], used = {}, visited = {}, g = isGuessing();
    steps.forEach(function(s){ used[s.n] = true; });
    for (var j = 0; j < i; j++) visited[steps[j].n] = true;
    Object.keys(byId).forEach(function(id){
      var c = byId[id].g.classList;
      c.toggle("active", !infoNode && !g && id === st.n);
      c.toggle("info", infoNode === id);
      c.toggle("visited", !infoNode && !!visited[id] && (g || id !== st.n));
      c.toggle("dim", !used[id] && infoNode !== id);
      c.toggle("unseen", guess && hideUnseen && !!used[id] && !visited[id] && !(id === st.n && !g) && infoNode !== id);
    });
    var hop = $("hop"), B = $("badges"); B.innerHTML = ""; hop.setAttribute("d", "");
    if (!infoNode && !g && i > 0 && steps[i-1].n !== st.n && byId[steps[i-1].n] && byId[st.n]){
      var a = byId[steps[i-1].n], b = byId[st.n];
      if (Math.abs((a.x + a.w/2) - (b.x + b.w/2)) < 30){
        var ax = a.x + a.w, bx = b.x + b.w, ay = a.y + a.h/2, by = b.y + b.h/2, cx2 = Math.max(ax, bx) + 10 + Math.min(26, Math.abs(by - ay) / 6);
        hop.setAttribute("d", "M" + ax + " " + ay + " C" + cx2 + " " + ay + " " + cx2 + " " + by + " " + (bx + 2) + " " + by);
      } else {
        var p = edgePoint(a, b), q = edgePoint(b, a);
        hop.setAttribute("d", "M" + p[0].toFixed(1) + " " + p[1].toFixed(1) + " L" + q[0].toFixed(1) + " " + q[1].toFixed(1));
      }
    }
    if (!infoNode && !g && byId[st.n]){
      var n = byId[st.n], bg = el("g", {"class":"badge"}, B);
      el("circle", {cx:n.x + 2, cy:n.y + 2, r:8.5}, bg);
      el("text", {x:n.x + 2, y:n.y + 5.5}, bg).textContent = i + 1;
    }
    positionCard();
    var box = byId[infoNode || st.n], dia = $("dia"), svg = $("svg");
    if (box && dia.scrollWidth > dia.clientWidth){
      var vb = svg.viewBox.baseVal, scale = svg.clientWidth / vb.width, cx = (box.x + box.w/2) * scale;
      if (cx < dia.scrollLeft + 30 || cx > dia.scrollLeft + dia.clientWidth - 30) dia.scrollLeft = cx - dia.clientWidth/2;
    }
  }

  function gkey(k){ return T.id + "|" + sc + "|" + k; }
  function isGuessing(){ return guess && !infoNode && i > 0 && !revealed[gkey(i)]; }
  function scoreOf(){ return scores[T.id + "|" + sc] || (scores[T.id + "|" + sc] = {ok:0, n:0}); }
  function seeded(seed){ return function(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; }
  function guessOptions(){
    var correct = steps[i].n, rnd = seeded(i * 131 + sc * 17 + tp * 7 + 3), pool = [], seen = {};
    seen[correct] = 1;
    steps.forEach(function(s){ if (!seen[s.n]){ seen[s.n] = 1; pool.push(s.n); } });
    T.NODES.forEach(function(n){ if (!seen[n[0]]){ seen[n[0]] = 1; pool.push(n[0]); } });
    var near = pool.slice(0, Math.max(3, pool.length));
    var picks = [];
    while (picks.length < 3 && near.length){ var j = Math.floor(rnd() * Math.min(near.length, 8)); picks.push(near.splice(j, 1)[0]); }
    picks.push(correct);
    for (var a = picks.length - 1; a > 0; a--){ var b = Math.floor(rnd() * (a + 1)); var tmp = picks[a]; picks[a] = picks[b]; picks[b] = tmp; }
    return picks;
  }
  function answer(id){
    var k = gkey(i), ok = id === steps[i].n, sc0 = scoreOf();
    if (id){ sc0.n++; if (ok) sc0.ok++; }
    verdicts[k] = id ? (ok ? "ok" : "no:" + id) : "skip";
    revealed[k] = true; render(); keepCardVisible();
  }
  function verdictHtml(){
    var v = verdicts[gkey(i)], sco = scoreOf();
    if (!v || infoNode) return "";
    var tail = ' <span class="score">· score ' + sco.ok + '/' + sco.n + '</span>';
    if (v === "ok") return '<div class="verdict ok">✓ Correct: ' + esc(nodeMeta(steps[i].n).label) + tail + '</div>';
    if (v === "skip") return '<div class="verdict no">Answer: ' + esc(nodeMeta(steps[i].n).label) + tail + '</div>';
    return '<div class="verdict no">✗ You picked ' + esc(nodeMeta(v.slice(3)).label) + ' — it was ' + esc(nodeMeta(steps[i].n).label) + tail + '</div>';
  }

  function render(){
    var s = T.SCENARIOS[sc], st = steps[i], sv = states[i];
    $("counter").textContent = (i+1) + " / " + steps.length;
    var last = i === steps.length - 1, prevOff = !infoNode && i === 0 && !s.prev, nextOff = !infoNode && last && !s.next;
    var navHtml = '<div class="cnav"><button type="button" id="cprev"' + (prevOff ? ' disabled' : '') + '>' + (!infoNode && i === 0 && s.prev ? '← Previous stage' : '← Back') + '</button>' +
      '<span class="counter">' + (i+1) + ' / ' + steps.length + '</span>' +
      '<button type="button" id="cnext"' + (nextOff ? ' disabled' : '') + '>' + (!infoNode && last && s.next ? 'Next stage →' : 'Next →') + '</button></div>';
    $("goal").textContent = s.goal; $("scenario").value = sc; $("topic").value = tp;
    Array.prototype.forEach.call($("chips").children, function(b, k){ b.classList.toggle("cur", k === i && !infoNode); b.classList.toggle("seen", k < i); });
    var cur = $("chips").children[i]; if (cur && cur.scrollIntoView) cur.scrollIntoView({block:"nearest", inline:"nearest"});

    var P = $("pane-step");
    // state rows
    var keys = Object.keys(sv.after);
    Object.keys(sv.diff).forEach(function(k){ if (sv.diff[k] === "del" && keys.indexOf(k) < 0) keys.push(k); });
    function rows(onlyChanged){
      var html = "";
      T.SECTIONS.forEach(function(sec){
        var ks = keys.filter(function(k){ return k.split("|")[0] === sec && (!onlyChanged || sv.diff[k]); });
        if (!ks.length) return;
        html += '<div class="sec">' + esc(sec) + '</div>';
        ks.forEach(function(k){
          var d = sv.diff[k] || "", mark = d === "add" ? "+" : d === "chg" ? "~" : d === "del" ? "−" : "";
          html += '<div class="row ' + d + '"><span class="m">' + mark + '</span><span class="k">' + esc(k.split("|")[1]) + '</span><span class="v">' + esc(d === "del" ? sv.before[k] : sv.after[k]) + '</span></div>';
        });
      });
      return html;
    }
    if (isGuessing()){
      var prevSt = steps[i-1], opts = guessOptions();
      P.innerHTML = '<div class="gq"><div class="note">Step ' + (i+1) + ' of ' + steps.length + ' · after: ' + esc(prevSt.t) + '</div>' +
        '<h2>Which box acts next?</h2><p class="note">Pick one below, or click the box in the diagram.</p><div class="opts">' +
        opts.map(function(id){ var m = nodeMeta(id); return '<button type="button" data-guess="' + id + '"><span>' + esc(m.label) + '</span><span class="oc">' + esc(m.cls) + '</span></button>'; }).join('') +
        '</div><button type="button" class="gskip" id="gskip">Show answer</button></div>' +
        '<div class="cnav"><button type="button" id="cprev">← Back</button><span class="counter">' + (i+1) + ' / ' + steps.length + '</span><span class="score">score ' + scoreOf().ok + '/' + scoreOf().n + '</span></div>';
    } else if (infoNode){
      var m = nodeMeta(infoNode);
      P.innerHTML = backHtml() + '<h2>' + esc(m.label) + '</h2><div class="where">' + esc(m.cls) + '</div><p>' + esc(m.desc) + '</p>' + ownHtml(infoNode) +
        '<h3>Not used in this scenario. Used in:</h3>' + (usedIn(infoNode).length ? jumpButtons(usedIn(infoNode)) : '<p class="empty">No scenario yet.</p>') +
        '<p class="note">Back / Next returns to the scenario.</p>' + navHtml;
    } else {
      var m2 = nodeMeta(st.n), other = usedIn(st.n).filter(function(u){ return u[0] !== sc; });
      var changed = rows(true), full = rows(false);
      P.innerHTML = backHtml() + verdictHtml() + (i === 0 && s.prev ? stageBtn(s.prev, "← Previous stage: ") : '') + '<h2>' + (i+1) + '. ' + esc(st.t) + '</h2>' +
        '<div class="where">' + esc(st.w) + '</div>' + navHtml +
        '<h3>What changed</h3>' + (changed ? '<div class="state">' + changed + '</div>' : '<p class="empty">Nothing changed in this step; it only decides or passes the call on.</p>') +
        (st.d.length ? '<h3>What happens</h3><ul>' + st.d.map(function(d){ return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' : '') +
        (st.iv && st.iv !== "—" ? '<h3>Say it in the interview</h3><p class="iv">' + esc(st.iv) + '</p>' : '') +
        (st.f && st.f !== "—" ? '<h3>If it fails</h3><p class="fail">' + esc(st.f) + '</p>' : '') +
        (st.z && st.z.length ? '<h3>Zoom in</h3><div class="links">' + st.z.map(function(z){ var tt = topicById(z[0]); return '<button type="button" class="zoom" data-zoom="' + z.join('|') + '">🔍 ' + esc(tt ? tt.name : z[0]) + ' · ' + esc(z[3]) + '</button>'; }).join('') + '</div>' : '') +
        (i === steps.length - 1 ? (s.next ? stageBtn(s.next, "Next stage → ") : '<p class="note end">End of this flow: the response has been sent.</p>') : '') +
        '<details><summary>Full state after this step</summary><div class="legend"><span><b style="color:var(--add)">+</b> added</span><span><b style="color:var(--chg)">~</b> changed</span><span><b style="color:var(--del)">−</b> removed</span></div><div class="state">' + (full || '<p class="empty">Empty.</p>') + '</div></details>' +
        '<details><summary>' + esc(m2.label) + ' · in your code</summary><p class="note"><code>' + esc(m2.cls) + '</code> — ' + esc(m2.desc) + '</p>' + ownHtml(st.n) +
        (other.length ? '<h3>Same box in other scenarios</h3>' + jumpButtons(other) : '') + '</details>';
    }
    if (focus && infoNode && !byId[infoNode]) drawSvg();
    drawState();
    try { history.replaceState(null, "", "#" + T.id + "/" + (sc+1) + "/" + (i+1)); } catch (e) {}
  }

  function go(k, fromNext){ var had = infoNode; infoNode = null; i = Math.max(0, Math.min(steps.length - 1, k)); if (!fromNext) revealed[gkey(i)] = true; if (had && focus) drawSvg(); render(); keepCardVisible(); }
  function keepCardVisible(){ var c = $("card"), r = c.getBoundingClientRect(), top = $("top").offsetHeight; if (r.top < top || r.top > window.innerHeight - 120) try { window.scrollTo({top: window.scrollY + r.top - top - 12, behavior: "smooth"}); } catch (e) {} }
  function setScenario(k, step){ sc = k; infoNode = null; build(); renderYours(); renderChips(); drawSvg(); go(step || 0); }
  function setTopic(k, s, step){ tp = k; T = TOPICS[k]; s = Math.min(s || 0, T.SCENARIOS.length - 1); $("versions").textContent = T.versions; fillScenarios(); setScenario(s || 0, step || 0); }
  function clickNode(id){
    if (isGuessing()){ answer(id); return; }
    var hits = []; steps.forEach(function(s, idx){ if (s.n === id) hits.push(idx); });
    if (!hits.length){ infoNode = id; render(); return; }
    var next = hits.filter(function(h){ return h > i; });
    go(!infoNode && hits.indexOf(i) >= 0 ? (next.length ? next[0] : hits[0]) : (next.length ? next[0] : hits[0]));
  }

  $("topic").addEventListener("change", function(){ backStack = []; setTopic(+this.value); });
  $("scenario").addEventListener("change", function(){ setScenario(+this.value); });
  $("dia").addEventListener("scroll", positionCard);
  $("focus").addEventListener("click", function(){ focus = !focus; this.setAttribute("aria-pressed", String(focus)); drawSvg(); drawState(); });
  $("guess").addEventListener("click", function(){ guess = !guess; this.setAttribute("aria-pressed", String(guess)); $("hideun").hidden = !guess; render(); });
  $("hideun").addEventListener("click", function(){ hideUnseen = !hideUnseen; this.setAttribute("aria-pressed", String(hideUnseen)); drawState(); });
  $("mine").addEventListener("click", function(){ var on = this.getAttribute("aria-pressed") !== "true"; this.setAttribute("aria-pressed", String(on)); $("svg").classList.toggle("mine", on); });
  $("pane-step").addEventListener("click", function(ev){
    var gb = ev.target.closest("button[data-guess]"); if (gb){ answer(gb.dataset.guess); return; }
    if (ev.target.closest("#gskip")){ answer(null); return; }
    if (ev.target.closest("#cnext")){ stepNext(); return; }
    if (ev.target.closest("#cprev")){ stepPrev(); return; }
    var zb = ev.target.closest("button[data-zoom]"); if (zb){ zoomTo(zb.dataset.zoom); return; }
    if (ev.target.closest("#back")){ var b0 = backStack.pop(); setTopic(b0.tp, b0.sc, b0.i); return; }
    var b = ev.target.closest("button[data-go]"); if (!b) return; var p = b.dataset.go.split(","); setScenario(+p[0], +p[1]);
  });
  document.addEventListener("keydown", function(ev){
    if (ev.target.closest && (ev.target.closest(".node") || ev.target.tagName === "SELECT")) return;
    if (ev.key === "ArrowRight") stepNext();
    if (ev.key === "ArrowLeft") stepPrev();
  });
  function topH(){ document.documentElement.style.setProperty("--topH", ($("top").offsetHeight + 12) + "px"); }
  var rsz; window.addEventListener("resize", function(){ topH(); clearTimeout(rsz); rsz = setTimeout(function(){ drawSvg(); drawState(); }, 120); });

  // start from #topic/scenario/step if present
  var h = (location.hash || "").slice(1).split("/"), k0 = 0;
  TOPICS.forEach(function(t, k){ if (t.id === h[0]) k0 = k; });
  setTopic(k0, Math.max(0, (+h[1] || 1) - 1), Math.max(0, (+h[2] || 1) - 1));
  topH();
})();
</script>
