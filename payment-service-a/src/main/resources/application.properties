spring.application.name=PaymentA

server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# Tracing: one trace id on every log line of a payment, carried A -> B -> Notification
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[%X{traceId:-}]\u0020
# keeps the trace across WebClient .block()
spring.reactor.context-propagation=auto

# Option 1: GET /actuator/mappings lists every URL and the controller method that handles it (needs any valid token)
management.endpoints.web.exposure.include=health,mappings

# Swagger UI (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
